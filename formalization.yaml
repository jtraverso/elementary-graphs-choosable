version: "v0.4"

project:
  name: "Elementary graphs are chromatic-choosable (for the Maffray–Reed class of augmented bipartite line graphs)"
  description: >-
    A Lean 4 / Mathlib formalization of the proof of Narayanan, Vasudevan and Somasundaram
    (arXiv:2610.16258) that elementary graphs satisfy ch(G) = χ(G) = ω(G), for the class that the
    Maffray–Reed theorem produces: augmentations of line graphs of bipartite multigraphs, given by
    an explicit edge representation (IsAugLineGraphRep: vertex v is the edge {a v, b v} of a
    bipartite multigraph; non-adjacent pairs sharing an end share exactly one end, which is a hub
    with at most two neighbours; no edge joins two hubs). Proved: clique number at most k implies
    k-choosability for every colour type (choosable_of_rep), ch = χ = ω with the choice number
    defined through lists of natural numbers (chromaticChoosable_of_rep), every graph of the class
    is elementary (isElementary_of_rep), and line graphs of bipartite multigraphs and complements
    of bipartite graphs belong to the class. NOT proved: the "only if" direction of Maffray–Reed
    (an elementary graph is such an augmentation), so the theorem is not stated for all elementary
    graphs. The proof follows the paper (Hall, the Deficiency Lemma, saturation of a minimal
    counterexample, Proposition 3.7, Galvin), except that the saturation step avoids Kőnig's
    theorem by adding one missing pair at a time. Galvin's theorem for bipartite multigraphs is
    imported as a lake dependency from PALOMAR-2026-10-18-000029 v2.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

