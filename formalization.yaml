    note: >-
      Both directions of the characterization of elementary graphs as augmentations of line graphs
      of bipartite multigraphs are formalized (isElementary_of_rep, rep_of_isElementary).
      Theorems 3 and 4 are replaced by a "bend" lemma; the p. 143 remark and Case 3 of claim (2)
