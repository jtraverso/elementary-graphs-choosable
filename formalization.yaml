    - {source: "Theorem 1.1 (augmentation class): ch = χ = ω", lean: "ElemChoos.chromaticChoosable_of_rep", module: "ElemChoosChallenge", status: "proved"}
    - {source: "Theorem 3.2 'if' direction (Maffray–Reed): augmentations are elementary", lean: "ElemChoos.isElementary_of_rep", module: "ElemChoosChallenge", status: "proved"}
    - {source: "§1: line graphs of bipartite multigraphs are in the class", lean: "ElemChoos.rep_of_lineGraph", module: "ElemChoosChallenge", status: "proved"}
    - {source: "§1: complements of bipartite graphs are in the class", lean: "ElemChoos.rep_of_cobipartite", module: "ElemChoosChallenge", status: "proved"}

