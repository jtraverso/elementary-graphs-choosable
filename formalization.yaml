      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Read the paper, checked the proof, and wrote the Lean development (ElemChoos/*.lean), the
        Challenge/Solution pair and the packaging under the author's direction. Checked with lean
        against the pinned dependency, #print axioms and a comparison of the elaborated Challenge
        and Solution statements (pp.all) (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements in the Challenge and the
    Solution.

fidelity:
  divergences: >-
    The theorem is stated for graphs given with an augmentation representation, not for all
    elementary graphs (the Maffray–Reed characterization is not formalized). The representation
    is the normalized one of Lemmas 3.3 and 3.8 (augmented flat edges as stars of degree-2 hubs,
    with the two edges multiplied); the condition that an augment has at least one X–Y edge is
    dropped, which only enlarges the class (isElementary_of_rep shows the class stays inside the
    elementary graphs). Elementary is a symmetric red/blue relation on pairs. Choosability uses
    lists of natural numbers (choosable_of_rep allows any colour type); the choice number is an
    ℕ∞-valued infimum like Mathlib's chromaticNumber.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, separate from the mechanical verification. The agent checked
    every step of the paper's proof and found no gap. Kőnig's theorem (Lemma 2.3) is avoidable,
    and Lemma 3.6(c) is only needed to get r, s ≥ 1. It also checked that the class excludes the
    claw and contains K(X,Y) − M and line graphs of bipartite multigraphs. No independent human
    review has been performed.

